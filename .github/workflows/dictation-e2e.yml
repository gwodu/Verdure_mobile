name: Dictation E2E Test

# Boots a real Android 14 emulator and proves dictation output lands in a
# focused text field (and that the floating mic shows/hides with focus),
# so regressions are caught in CI instead of on-device.

on:
  push:
    branches: [ main, voice-typing-whisper ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dictation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Enable KVM for emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Inject Firebase config
      env:
        FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
      run: |
        if [ -n "$FIREBASE_CONFIG" ]; then
          echo "$FIREBASE_CONFIG" > VerdureApp/app/google-services.json
        fi

    - name: Build Debug APK
      working-directory: ./VerdureApp
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Run dictation E2E on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -camera-back none
        script: bash .github/scripts/dictation_e2e.sh

    - name: Upload E2E artifacts (screenshots + logs)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dictation-e2e-artifacts
        path: e2e-artifacts/
        retention-days: 14
